<text x="48" y="1048" font-size="22" font-weight="700">装配约束</text>
<text x="48" y="1080" font-size="16">1. 舵机正极只接 SERVO_5V，不能接 NUCLEO/P4 的 3.3V 或 5V 引脚；大电流不经过面包板。</text>
<text x="48" y="1107" font-size="16">2. 三路成品电源正极各自独立，严禁并联；GND 共地。断电接线，额定值与实际电流仍需验证。</text>
<text x="48" y="1134" font-size="16">3. NUCLEO 充电器供电：JP1 ON、JP5 U5V；该路径整板不超过 100mA，详见供电文档。</text>
<text x="48" y="1161" font-size="16">4. OV5647 用原厂 CSI 排线接 P4；排针方向、FFC 接触面和运动余量在到货后核对。</text>
<text x="48" y="1188" font-size="16">5. 本图由接口清单生成；嘉立创原生工程导入、ERC 和实物连线验收仍分别记录。</text>
</svg>