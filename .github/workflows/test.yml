name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: software/server
      - run: npm test
        working-directory: software/server
      - run: npm test
        working-directory: software/web
      - run: python3 build.py --host
        working-directory: firmware/stm32
