name: active-inspection
services:
  server:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    restart: unless-stopped
    secrets: [inspection_config]
    volumes: [inspection_data:/data]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  mediamtx:
    image: bluenviron/mediamtx:1.15.6
    restart: unless-stopped
    volumes: [./mediamtx.yml:/mediamtx.yml:ro]
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_MEDIA_HOST:?Set PUBLIC_MEDIA_HOST to reachable public IP or DNS}
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    networks: [internal]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your owned domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    depends_on: [server]
    security_opt: [no-new-privileges:true]
secrets:
  inspection_config:
    file: ./secrets/config.production.json
volumes:
  inspection_data:
  caddy_data:
  caddy_config:
networks:
  internal:
    # 名称 internal 表示服务间网络；不可设 internal:true，否则 Caddy 无法申请证书。
